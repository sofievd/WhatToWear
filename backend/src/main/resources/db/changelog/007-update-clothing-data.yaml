databaseChangeLog:
  - changeSet:
      id: "007"
      author: "Tehreem"
      changes:
        - sql:
            sql: |
              UPDATE clothes
              SET item = CASE id
                WHEN 51 THEN 'underwear'
                WHEN 52 THEN 'long underwear'
                WHEN 53 THEN 'undershirt'
                WHEN 74 THEN 'socks'
                ELSE item
              END,
