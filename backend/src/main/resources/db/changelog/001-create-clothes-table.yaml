databaseChangeLog:
  - changeSet:
      id: "001"
      author: "Sofie Van Dingenen"
      changes:
        - createTable:
            tableName: clothes
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: clo-value
                  type: double
                  constraints:
                    nullable: false