spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/what-to-wear
    username: postgres
    password: password

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
