spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]

  application:
    name: backend

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  datasource:
    url: jdbc:postgresql://localhost:5432/what-to-wear
    username: postgres
    password: password

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
